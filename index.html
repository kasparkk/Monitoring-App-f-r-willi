<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12160F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Verjüngungszustandsmonitoring</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #12160F; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Lief hier schon eine Fassung? Dann ist ein Wechsel ein echtes Update.
        var hatteController = !!navigator.serviceWorker.controller;
        var laedtNeu = false;

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });

        /* Uebernimmt eine neue Fassung, wird die Seite einmal neu geladen.
           Sonst laeuft die alte Oberflaeche weiter, bis die App vollstaendig
           geschlossen wird - genau das hat frueher dazu gefuehrt, dass
           Aenderungen auf dem Geraet erst viel spaeter ankamen. */
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hatteController || laedtNeu) return;
          laedtNeu = true;
          location.reload();
        });
      }
    </script>
  </body>
</html>
